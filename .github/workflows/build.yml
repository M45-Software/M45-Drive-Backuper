name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deb:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev python3 borgbackup dpkg-dev gnupg
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cd build && cpack -G DEB
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: m45-drive-backuper-deb
          path: build/*.deb
  release:
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: deb
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m45-drive-backuper-deb
          path: release
      - name: Publish tested preview package
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(M45DriveBackuper VERSION \([^ ]*\) .*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
          package="m45-drive-backuper_${version}_amd64.deb"
          test -f "release/$package"
          (cd release && sha256sum "$package" > SHA256SUMS)
          gh release create "v$version" "release/$package" release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "v$version — Preview update" \
            --notes-file "docs/releases/v$version.md" --prerelease

  apt:
    needs: release
    uses: ./.github/workflows/publish-apt.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      M45_APT_DEPLOY_KEY: ${{ secrets.M45_APT_DEPLOY_KEY }}
