name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deb:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 250M
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        uses: ./.github/actions/setup-build-deps
        with:
          packages-file: .github/ci/apt-packages.txt
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.github/workflows/build.yml') }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.github/workflows/build.yml') }}-
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DPython3_EXECUTABLE=/usr/bin/python3 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build --parallel 2
      - name: Compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cd build && cpack -G DEB
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: m45-drive-backuper-deb
          path: build/*.deb
  release:
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: deb
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m45-drive-backuper-deb
          path: release
      - name: Publish tested preview package
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(M45DriveBackuper VERSION \([^ ]*\) .*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
          package="m45-drive-backuper_${version}_amd64.deb"
          test -f "release/$package"
          (cd release && sha256sum "$package" > SHA256SUMS)
          gh release create "v$version" "release/$package" release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "v$version — Preview update" \
            --notes-file "docs/releases/v$version.md" --prerelease

  apt:
    needs: release
    uses: ./.github/workflows/publish-apt.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      M45_APT_DEPLOY_KEY: ${{ secrets.M45_APT_DEPLOY_KEY }}
